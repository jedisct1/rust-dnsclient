[package]
name = "dnsclient"
version = "0.2.3"
description = "DNS client and stub resolver with synchronous and async Tokio or Smol APIs, configurable upstream servers, and automatic UDP-to-TCP fallback."
authors = ["Frank Denis <github@pureftpd.org>"]
keywords = ["dns", "client", "resolver", "async", "tokio"]
license = "ISC"
homepage = "https://github.com/jedisct1/rust-dnsclient"
repository = "https://github.com/jedisct1/rust-dnsclient"
categories = ["os::unix-apis"]
edition = "2018"

[dependencies]
smol = { version = "2.0.2", optional = true }
futures-lite = { version = "2.6.1", optional = true }
dnssector = "0.2.14"
rand = "0.9.5"
tokio = { version = "1.53.1", optional = true, features = ["full"] }

[features]
async-smol = [ "smol", "futures-lite" ]
async-tokio = [ "tokio" ]
default = [ "async-tokio" ]
# If async-smol is specified as a feature, it will be used even if async-tokio is also enabled
