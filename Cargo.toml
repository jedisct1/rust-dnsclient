[package]
name = "dnsclient"
version = "0.2.0"
description = "A small, simple and secure DNS client library"
authors = ["Frank Denis <github@pureftpd.org>"]
keywords = ["dns", "client"]
license = "ISC"
homepage = "https://github.com/jedisct1/rust-dnsclient"
repository = "https://github.com/jedisct1/rust-dnsclient"
categories = ["os::unix-apis"]
edition = "2018"

[dependencies]
smol = { version = "2.0.0", optional = true }
futures-lite = { version = "2.2.0", optional = true }
dnssector = "0.2.14"
rand = "0.9.1"
tokio = { version = "1.44.2", optional = true, features = ["full"] }

[features]
async-smol = [ "smol", "futures-lite" ]
async-tokio = [ "tokio" ]
default = [ "async-tokio" ]
# If async-smol is specified as a feature, it will be used even if async-tokio is also enabled
